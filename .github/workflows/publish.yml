name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Verify release version
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
        shell: bash
        run: |
          actual="$(python -c 'from pathlib import Path; import re; print(re.search(r"__version__ = \"([^\"]+)\"", Path("src/attune/_version.py").read_text()).group(1))')"
          test "$actual" = "${EXPECTED_VERSION#v}"

      - name: Build package
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: ${{ (inputs.ref != '' && !inputs.prerelease) || (github.event_name == 'release' && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/attune-sdk
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  test-publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (inputs.ref != '' && inputs.prerelease) || (github.event_name == 'release' && github.event.release.prerelease) }}
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/attune-sdk
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
